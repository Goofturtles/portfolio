<!--
  One full-screen stage that moves between places (film/notes/briefs/site.md). No build step.
    js/main.js      start-up, the route in the address (#projects ...), every change of place, themes
    js/room.js      the room: the picture, its objects as buttons   js/tunnel.js   the clip of the flight, once it exists
    js/desktop.js   the mini desktop: wallpaper, windows, and its phone layout     js/shell.js  the taskbar (room and desktop), search, window frame
    js/icons.js     every icon: Fluent System Icons (media/icons/)                css/shell.css  type, buttons, taskbar, frames, the room
    js/apps/        the apps on it: explorer (Projects), player (Films), board (How I work), trophies (Results), chat (Contact), about
    js/pages.js     the fanned sheets                              js/ai.js       AI Arjun as a phone browser page
    js/sections.js  his content as plain sections (About, plain.html, AI Arjun's phone tabs)
    apps/           film/ui/, copied by tools/sync_ui.py           media/manifest.json   every render, by tools/sync_media.py
                                                                   media/own.json        his own process material, by tools/sync_own.py
-->
<!-- the loader (#boot, below): the first paint is this calm screen, not the still; js/room.js ends it through window.__boot.done() -->
<style>
html, body { background: #101012; }
#boot { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #101012; color: #ececf0; opacity: 1; transition: opacity .6s cubic-bezier(.4, 0, .2, 1); }
#boot.out { opacity: 0; pointer-events: none; }
#boot .bn { font: 600 clamp(26px, 4.2vw, 44px)/1.3 "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.01em; animation: bnin .7s ease-out both; }
#boot .bl { width: clamp(140px, 22vw, 220px); height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .13); overflow: hidden; }
#boot .bl i { display: block; width: 100%; height: 100%; background: #ececf0; transform: scaleX(0); transform-origin: 0 50%; }
#boot.calm { transition-duration: .25s; }
#boot.calm .bn { animation: none; }
@keyframes bnin { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #boot { transition-duration: .25s; } #boot .bn { animation: none; } }
</style>

<!-- three.js 0.184.0 (MIT), copied into vendor/three/: only the live room (js/room3d/) imports it, and only when it will run -->
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="js/main.js"></script>

<body>
<div id="boot" role="status" aria-label="Loading"><div class="bn">Arjun Sharma</div><div class="bl"><i></i></div></div>
<script>
// The loader's line fills with real progress (the room's requests finishing, counted from the resource timings) and
// otherwise eases toward 90 %; it completes when js/room.js calls __boot.done(): 'live' once the live room has drawn its
// first frame, 'still' when this visit is shown the picture (no WebGL 2, reduced motion, saving data). If the room has
// not come up after 15 s the loader gives way to the still and the room swaps in later, as it always has.
(function () {
  var boot = document.getElementById('boot'), bar = boot.querySelector('i'), t0 = performance.now(), shown = 0, real = 0, EXPECT = 20, over = false, raf = 0, iv = 0, calm = false
  try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches || localStorage.getItem('pc-calm') === '1' } catch (e) {}
  if (calm) boot.className = 'calm'
  function set(v) { bar.style.transform = 'scaleX(' + v.toFixed(4) + ')' }
  function want() { return Math.min(0.9, Math.max(0.9 * (1 - Math.exp(-(performance.now() - t0) / 5000)), 0.9 * real / EXPECT)) }
  try { new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { if (e.name.indexOf('/room3d/') > -1) real++ }) }).observe({ type: 'resource', buffered: true }) } catch (e) {}
  function tick() { shown += (want() - shown) * 0.06; set(shown); raf = requestAnimationFrame(tick) }
  if (calm) iv = setInterval(function () { shown = Math.max(shown, want()); set(shown) }, 400); else raf = requestAnimationFrame(tick)
  function done() {
    if (over) return
    over = true; cancelAnimationFrame(raf); clearInterval(iv); clearTimeout(cap)
    if (!calm) bar.style.transition = 'transform .2s ease-out'
    set(1)
    setTimeout(function () { boot.classList.add('out') }, calm ? 0 : 200)
    setTimeout(function () { boot.remove() }, 1100)
  }
  var cap = setTimeout(done, 15000)
  window.__boot = { done: done }
})()
</script>
<div id="app" class="site" data-place="room">

</div>
